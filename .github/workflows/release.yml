name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 - "$GITHUB_REF_NAME" > notes.md <<'PY'
          import re, sys
          version = re.escape(sys.argv[1])
          text = open("CHANGELOG.md").read()
          match = re.search(rf"## \[{version}\][^\n]*\n(.*?)(?=\n## \[|\Z)", text, re.S)
          if not match:
              sys.exit(f"No CHANGELOG section for {sys.argv[1]}")
          print(match.group(1).strip())
          PY
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
